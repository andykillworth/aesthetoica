# Every 15 minutes: pull today's events into the `data` branch.
# GitHub's scheduler can lag; cron-job.org can also trigger this via workflow_dispatch.
name: fetch
on:
  schedule: [{cron: "*/15 * * * *"}]
  workflow_dispatch: {}
concurrency: {group: data, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: data, path: databranch}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r pipeline/requirements.txt
      - run: python pipeline/fetch.py
        env: {DATA_DIR: databranch}
      - name: commit data
        working-directory: databranch
        run: |
          git config user.name "aesthetoica bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "data $(date -u +%FT%TZ)" && git push)
